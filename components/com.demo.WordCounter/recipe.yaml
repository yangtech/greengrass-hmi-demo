---
RecipeFormatVersion: "2020-01-25"

ComponentName: com.demo.WordCounter
ComponentVersion: "1.0.0"
ComponentDescription: >
  Headless component that subscribes to demo/answer (topic A), counts words,
  and publishes the count to demo/wordcount (topic B) via IPC local pub/sub.
ComponentPublisher: Demo
ComponentDependencies:
  aws.greengrass.Nucleus:
    VersionRequirement: ">=2.5.0"

ComponentConfiguration:
  DefaultConfiguration:
    accessControl:
      aws.greengrass.ipc.pubsub:
        com.demo.WordCounter:pubsub:1:
          policyDescription: "Allow subscribing to demo/answer topic"
          operations:
            - "aws.greengrass#SubscribeToTopic"
          resources:
            - "demo/answer"
        com.demo.WordCounter:pubsub:2:
          policyDescription: "Allow publishing to demo/wordcount topic"
          operations:
            - "aws.greengrass#PublishToTopic"
          resources:
            - "demo/wordcount"

Manifests:
  - Platform:
      os: linux
    Lifecycle:
      Install:
        Script: |
          pip3 install --user -r {artifacts:path}/requirements.txt
      Run:
        Script: |
          python3 -u {artifacts:path}/counter.py
